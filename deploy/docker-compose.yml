# Local single-host development stack.
#
# The results volume is shared by the API and every worker, which is what lets
# the API read back what a worker wrote. That assumes single-host deployment —
# stated plainly in README.md rather than engineered around: a genuinely
# multi-node deployment needs a network-shared volume or object storage, and
# that is not built here.

name: parallels

services:
  worker-backtest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker-backtest
    image: parallels/worker-backtest:latest
    # Fixed name because the API execs into it by name.
    container_name: parallels-worker-backtest
    # Stays warm and idle; jobs arrive as `docker exec`, never `docker run`.
    restart: unless-stopped
    volumes:
      - ../data:/data:ro
      - ../results:/results

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: parallels/api:latest
    container_name: parallels-api
    depends_on:
      - worker-backtest
    ports:
      # Host port is configurable because 5080 is a popular default and
      # collides easily. Only the host side moves — the container still listens
      # on 8080, and the frontend reaches it over the compose network, so
      # changing this cannot break the UI.
      - "${PARALLELS_API_PORT:-5080}:8080"
    volumes:
      - ../data:/data:ro
      - ../results:/results
      - ../state:/state
      # Lets the API exec into the warm backtest container and manage the live
      # container's lifecycle. Mounting the daemon socket grants control of the
      # host's Docker — appropriate for local development, not for a shared or
      # internet-exposed host.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PARALLELS_BACKTEST_CONTAINER: parallels-worker-backtest
      # The API launches the live container itself, and `docker run -v` is
      # resolved by the daemon on the host — so it needs host paths, not the
      # /data and /results it sees internally.
      #
      # Left empty rather than mandatory: only live trading needs these, and a
      # compose-level required variable made `down`, `logs` and `ps` fail for
      # everyone else. The API refuses to launch the live worker with a specific
      # message if they are missing, which is where the problem actually bites.
      # Set PARALLELS_HOST_ROOT (see deploy/.env.example) before enabling an alpha.
      #
      # The root is passed through whole rather than pre-joined into two paths:
      # an unset variable would otherwise render as the literal "/data", which is
      # a wrong value rather than an absent one, and the API could not tell the
      # difference in order to complain about it.
      PARALLELS_HOST_ROOT: ${PARALLELS_HOST_ROOT:-}
      # Credentials are passed through to the live container at launch and are
      # never written into stored desired state.
      BINANCE_API_KEY: ${BINANCE_API_KEY:-}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:-}
      BINANCE_ENVIRONMENT: ${BINANCE_ENVIRONMENT:-testnet}
      # Must be explicitly "true" for the live worker to trade real funds.
      PARALLELS_CONFIRM_MAINNET: ${PARALLELS_CONFIRM_MAINNET:-false}

  # Built here so `docker compose build` produces the image the API launches,
  # but never started by compose: the API owns its lifecycle, starting it when
  # the first alpha is enabled and stopping it when none remain.
  worker-live-binance:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker-live-binance
    image: parallels/worker-live-binance:latest
    profiles: ["never-start-directly"]

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${PARALLELS_WEB_PORT:-5173}:5173"
    volumes:
      - ../src/Parallels.Web:/web
      # Keeps the container's node_modules off the host mount. Without this the
      # container would reuse whatever the host installed, and native binaries
      # built for the host will not run on alpine.
      - web-node-modules:/web/node_modules
    environment:
      PARALLELS_API_URL: http://api:8080
    depends_on:
      - api

volumes:
  web-node-modules:
